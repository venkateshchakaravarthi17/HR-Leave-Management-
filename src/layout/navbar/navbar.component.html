<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form #changeForm="ngForm" (ngSubmit)="changePassword(changeForm)">
        <div class="modal-header">
          <h5 class="modal-title">Change Password</h5>
          <button type="button" class="btn-close" (click)="closeChangePassword()"></button>
        </div>
        <div class="modal-body">
          <div class="form-group mb-3">
            <label>Current Password</label>
            <input type="password" class="form-control" required [(ngModel)]="currentPassword" name="currentPassword">
          </div>
          <div class="form-group mb-3">
            <label>New Password</label>
            <input type="password" class="form-control" required [(ngModel)]="newPassword" name="newPassword">
          </div>
          <div class="form-group mb-3">
            <label>Confirm New Password</label>
            <input type="password" class="form-control" required [(ngModel)]="confirmPassword" name="confirmPassword">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeChangePassword()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            {{ loading ? 'Saving...' : 'Change Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
