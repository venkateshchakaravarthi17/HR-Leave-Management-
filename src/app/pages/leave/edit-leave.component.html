<!-- src/app/pages/leave/edit-leave.component.html -->
<div class="card" *ngIf="leave; else loadingTpl">
  <div class="card-header">
    <h3 class="mb-0">Edit Leave Request</h3>
  </div>

  <div class="card-body">
    <form #editForm="ngForm" (ngSubmit)="update(editForm)" novalidate>
      <div class="row">
        <!-- Leave Type -->
        <div class="col-md-4 mb-3">
          <label class="form-label">Leave Type</label>
          <select
            class="form-control"
            name="LeaveTypeId"
            [(ngModel)]="model.LeaveTypeId"
            required
          >
            <option value="" disabled>Select leave type</option>
            <option *ngFor="let lt of leaveTypes" [value]="lt.leaveTypeId || lt.LeaveTypeId">
              {{ lt.leaveTypeName || lt.LeaveTypeName }}
            </option>
          </select>
        </div>

        <!-- Start Date -->
        <div class="col-md-4 mb-3">
          <label class="form-label">Start Date</label>
          <input
            type="date"
            class="form-control"
            name="StartDate"
            [(ngModel)]="model.StartDate"
            required
            [min]="today"
            (click)="openDatePicker($event)"
            (change)="validateDate($event, 'start')"
          />
        </div>

        <!-- End Date -->
        <div class="col-md-4 mb-3">
          <label class="form-label">End Date</label>
          <input
            type="date"
            class="form-control"
            name="EndDate"
            [(ngModel)]="model.EndDate"
            required
            [min]="model.StartDate || today"
            (click)="openDatePicker($event)"
            (change)="validateDate($event, 'end')"
          />
        </div>

        <!-- Reason (CKEditor) -->
        <div class="col-12 mb-3">
          <label class="form-label">Reason</label>
          <ckeditor
            [(ngModel)]="model.Reason"
            name="Reason"
            required
            minlength="3"
            [editor]="Editor"
            [config]="{ placeholder: 'Enter your reason for leave...' }"
          ></ckeditor>
        </div>

        <!-- File Attachments -->
        <div class="col-md-6 mb-3">
          <label class="form-label">Replace / Add Files</label>
          <input
            type="file"
            class="form-control"
            (change)="onFileChange($event)"
            multiple
            #fileInput
            accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.txt"
          />
          <div class="mt-2" *ngIf="selectedFiles?.length">
            <div *ngFor="let f of selectedFiles" class="small">
              {{ f.name }} ({{ (f.size / 1024) | number: '1.0-0' }} KB)
            </div>
            <button
              type="button"
              class="btn btn-link p-0"
              (click)="resetFileInput(fileInput)"
            >
              Clear files
            </button>
          </div>
        </div>

        <!-- Existing Attachments -->
        <div class="col-12 mb-3" *ngIf="leave?.temporaryBlobUrls?.length">
          <label class="form-label">Existing Attachments</label>
          <ul class="list-unstyled">
            <li *ngFor="let u of leave.temporaryBlobUrls">
              <a href (click)="openFile(u); $event.preventDefault()" class="link-primary">{{ u | slice:0:60 }}...</a>
            </li>
          </ul>
        </div>

        <!-- Half-Day Options -->
        <div class="col-md-3 mb-3 d-flex align-items-center">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              name="IsStartDateHalfDay"
              [(ngModel)]="model.IsStartDateHalfDay"
              [disabled]="!isHalfDayAllowed"
            />
            <label class="form-check-label">Start date half day</label>
          </div>
        </div>

        <div class="col-md-3 mb-3 d-flex align-items-center">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              name="IsEndDateHalfDay"
              [(ngModel)]="model.IsEndDateHalfDay"
              [disabled]="!isHalfDayAllowed"
            />
            <label class="form-check-label">End date half day</label>
          </div>
        </div>
      </div>

      <div class="card-footer d-flex">
        <button type="button" class="btn btn-danger me-2" (click)="cancelLeave()" [disabled]="isSubmitting">
          Withdraw
        </button>
        <button class="btn btn-secondary me-2" routerLink="/leaves">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Update</span>
          <span *ngIf="isSubmitting">Updating...</span>
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="card">
    <div class="card-body">
      <p>Loading...</p>
    </div>
  </div>
</ng-template>
