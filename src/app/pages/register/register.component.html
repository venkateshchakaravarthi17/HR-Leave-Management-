<div class="register-page">
  <div class="register-box w-100">
    <div class="card card-outline card-primary">
      <div class="register-logo text-center">
        <img src="assets/img/data1st_logo.png" alt="Company Logo" height="90" /><br />
        <a href="#" class="company-title">
          <b>Datafirst Solutions</b><br />
          <b>Analysis Services LLC</b>
        </a>
      </div>

      <div class="card-body">
        <p class="register-box-msg" style="font-size: x-large;">Register for New employee</p>

        <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)" class="row g-3">

          <!-- ============ ACCOUNT INFORMATION ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Account Information</h5>
          </div>

          <div class="col-lg-6 col-md-6 col-12">
            <label for="username" class="form-label fw-bold">Username</label>
            <div class="input-group mb-3">
              <input type="text" id="username" name="username" class="form-control" placeholder="Enter Username" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-user"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-6 col-12">
            <label for="employeename" class="form-label fw-bold">Employee Name</label>
            <div class="input-group mb-3">
              <input type="text" id="employeename" name="employeename" class="form-control" placeholder="Enter Employee Name" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-id-card"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-6 col-12">
            <label for="password" class="form-label fw-bold">Password</label>
            <div class="input-group mb-3">
              <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-lock"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-6 col-12">
            <label for="confirmpassword" class="form-label fw-bold">Confirm Password</label>
            <div class="input-group mb-3">
              <input type="password" id="confirmpassword" name="confirmpassword" class="form-control" placeholder="Confirm Password" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-lock"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ PERSONAL DETAILS ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Personal Details</h5>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="gender" class="form-label fw-bold">Gender</label>
            <div class="input-group mb-3">
              <select id="gender" name="gender" class="form-control" ngModel required>
                <option value="" disabled selected>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
              </select>
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-venus-mars"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="nationality" class="form-label fw-bold">Nationality</label>
            <div class="input-group mb-3">
              <select id="nationality" name="nationality" class="form-control" ngModel required>
                <option value="" disabled selected>Select Country</option>
                <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
              </select>
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-globe"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="dateOfBirth" class="form-label fw-bold">Date of Birth</label>
            <div class="input-group mb-3">
              <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="maritalStatus" class="form-label fw-bold">Marital Status</label>
            <div class="input-group mb-3">
              <select id="maritalStatus" name="maritalStatus" class="form-control" ngModel required>
                <option value="" disabled selected>Select Marital Status</option>
                <option>Single</option>
                <option>Married</option>
              </select>
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-heart"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ EMPLOYMENT DETAILS ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Employment Details</h5>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="status" class="form-label fw-bold">Status</label>
            <div class="input-group mb-3">
              <select id="status" name="status" class="form-control" ngModel required>
                <option value="" disabled selected>Select Status</option>
                <option>Active</option>
                <option>InActive</option>
              </select>
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-info-circle"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="employmentType" class="form-label fw-bold">Employment Type</label>
            <div class="input-group mb-3">
              <select id="employmentType" name="employmentType" class="form-control" ngModel required>
                <option value="" disabled selected>Select Employment Type</option>
                <option>FTE</option>
                <option>Contractor</option>
              </select>
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-briefcase"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="workLocation" class="form-label fw-bold">Work Location</label>
            <div class="input-group mb-3">
              <input type="text" id="workLocation" name="workLocation" class="form-control" placeholder="Enter Work Location" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-map-marker-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="emiratesIdNumber" class="form-label fw-bold">Emirates ID Number</label>
            <div class="input-group mb-3">
              <input type="text" id="emiratesIdNumber" name="emiratesIdNumber" class="form-control" placeholder="Enter Emirates ID Number" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-id-card"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="passportNumber" class="form-label fw-bold">Passport Number</label>
            <div class="input-group mb-3">
              <input type="text" id="passportNumber" name="passportNumber" class="form-control" placeholder="Enter Passport Number" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-passport"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="jobTitle" class="form-label fw-bold">Job Title</label>
            <div class="input-group mb-3">
              <input type="text" id="jobTitle" name="jobTitle" class="form-control" placeholder="Enter Job Title" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-briefcase"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="department" class="form-label fw-bold">Department</label>
            <div class="input-group mb-3">
              <input type="text" id="department" name="department" class="form-control" placeholder="Enter Department" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-building"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="managerName" class="form-label fw-bold">Manager Name</label>
            <div class="input-group mb-3">
              <input type="text" id="managerName" name="managerName" class="form-control" placeholder="Enter Manager Name" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-user-tie"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="dateOfJoining" class="form-label fw-bold">Date of Joining</label>
            <div class="input-group mb-3">
              <input type="date" id="dateOfJoining" name="dateOfJoining" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ CONTACT INFORMATION ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Contact Information</h5>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="personalEmail" class="form-label fw-bold">Personal Email</label>
            <div class="input-group mb-3">
              <input type="email" id="personalEmail" name="personalEmail" class="form-control" placeholder="Enter Personal Email" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-envelope"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="workEmail" class="form-label fw-bold">Work Email</label>
            <div class="input-group mb-3">
              <input type="email" id="workEmail" name="workEmail" class="form-control" placeholder="Enter Work Email" ngModel required />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-envelope"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="personalPhone" class="form-label fw-bold">Personal Phone (+CountryCode)</label>
            <div class="input-group mb-3">
              <input
                type="text"
                id="personalPhone"
                name="personalPhone"
                class="form-control"
                placeholder="+91 9876543210"
                ngModel
                required
                pattern="^\+\d{1,4}\s?\d{6,12}$"
              />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-phone"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="workPhone" class="form-label fw-bold">Work Phone (+CountryCode)</label>
            <div class="input-group mb-3">
              <input
                type="text"
                id="workPhone"
                name="workPhone"
                class="form-control"
                placeholder="+971 512345678"
                ngModel
                required
                pattern="^\+\d{1,4}\s?\d{6,12}$"
              />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-phone"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="currentAddress" class="form-label fw-bold">Current Address</label>
            <div class="input-group mb-3">
              <input type="text" id="currentAddress" name="currentAddress" class="form-control" placeholder="Enter Current Address" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-map-marker-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="permanentAddress" class="form-label fw-bold">Permanent Address</label>
            <div class="input-group mb-3">
              <input type="text" id="permanentAddress" name="permanentAddress" class="form-control" placeholder="Enter Permanent Address" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-map-marker-alt"></span></div>
              </div>
            </div>
          </div>

      <div class="col-lg-4 col-md-6 col-12">
        <label for="countryOfResidence" class="form-label fw-bold">Country Of Residence</label>
        <div class="input-group mb-3">
        <select id="countryOfResidence" name="countryOfResidence" class="form-control" ngModel required>
          <option value="" disabled selected>Select Country</option>
          <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
        </select>
      <div class="input-group-append">
      <div class="input-group-text"><span class="fas fa-globe"></span></div>
      </div>
  </div>
</div>


          <div class="col-lg-4 col-md-6 col-12">
            <label for="poBox" class="form-label fw-bold">PO Box</label>
            <div class="input-group mb-3">
              <input type="text" id="poBox" name="poBox" class="form-control" placeholder="Enter PO Box" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-mail-bulk"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ DOCUMENTS & EXPIRY DATES ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Documents Information</h5>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="passportExpiryDate" class="form-label fw-bold">Passport Expiry Date</label>
            <div class="input-group mb-3">
              <input type="date" id="passportExpiryDate" name="passportExpiryDate" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="visaExpiryDate" class="form-label fw-bold">Visa Expiry Date</label>
            <div class="input-group mb-3">
              <input type="date" id="visaExpiryDate" name="visaExpiryDate" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="emiratesIdExpiryDate" class="form-label fw-bold">Emirates ID Expiry Date</label>
            <div class="input-group mb-3">
              <input type="date" id="emiratesIdExpiryDate" name="emiratesIdExpiryDate" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="labourCardExpiryDate" class="form-label fw-bold">Labour Card Expiry Date</label>
            <div class="input-group mb-3">
              <input type="date" id="labourCardExpiryDate" name="labourCardExpiryDate" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="insuranceExpiryDate" class="form-label fw-bold">Insurance Expiry Date</label>
            <div class="input-group mb-3">
              <input type="date" id="insuranceExpiryDate" name="insuranceExpiryDate" class="form-control" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-calendar-alt"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ EMERGENCY CONTACT ============ -->
          <div class="col-12">
            <h5 class="text-primary border-bottom pb-2">Emergency Contact</h5>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="emergencyContactName" class="form-label fw-bold">Emergency Contact Name</label>
            <div class="input-group mb-3">
              <input type="text" id="emergencyContactName" name="emergencyContactName" class="form-control" placeholder="Enter Contact Name" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-user-friends"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="emergencyContactRelationship" class="form-label fw-bold">Emergency Contact Relationship</label>
            <div class="input-group mb-3">
              <input type="text" id="emergencyContactRelationship" name="emergencyContactRelationship" class="form-control" placeholder="Enter Relationship" ngModel />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-users"></span></div>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-md-6 col-12">
            <label for="emergencyContactNumber" class="form-label fw-bold">Emergency Contact Number</label>
            <div class="input-group mb-3">
              <input type="text" id="emergencyContactNumber" name="emergencyContactNumber" class="form-control" placeholder="+971 5XXXXXXXX" ngModel pattern="^\+\d{1,4}\s?\d{6,12}$" />
              <div class="input-group-append">
                <div class="input-group-text"><span class="fas fa-phone"></span></div>
              </div>
            </div>
          </div>

          <!-- ============ SUBMIT BUTTON (Centered) ============ -->
          <div class="col-12 text-center mt-4">
            <button type="submit" class="btn btn-primary px-5" [disabled]="registerForm.invalid">
              Register
            </button>
          </div>
        </form>

        <a routerLink="/login" class="text-center d-block mt-3">I already have an account</a>
      </div>
    </div>
  </div>
</div>
