<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <!-- <h3 class="card-title mb-0">Employee List</h3> -->
    <h3 class="mb-0">Employee List</h3>
    <!-- Only Admin can see Add button -->
    <button *ngIf="isAdmin" class="btn btn-primary btn-sm" (click)="addEmployee()">
      <i class="fas fa-user-plus"></i> Add Employee
    </button>
  </div>
  <br /><br />

  <div class="card-body p-0">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th style="width: 50px">#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th style="width: 150px" class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of employees; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ emp.employeeName }}</td>
          <td>{{ emp.workEmail }}</td>
          <td>{{ emp.department || '-' }}</td>
          <td class="text-center">
            <!-- Edit button: Admin or self -->
            <button *ngIf="isAdmin || emp.userId === currentUserId"
              class="btn btn-sm btn-info me-1"
              (click)="editEmployee(emp.employeeId!, emp.userId || '')">
              <i class="fas fa-edit"></i>
            </button>

            <!-- Delete button: Admin only -->
            <button *ngIf="isAdmin" class="btn btn-sm btn-danger" (click)="deleteEmployee(emp.employeeId!)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="!employees || employees.length === 0">
          <td colspan="5" class="text-center text-muted py-3">
            No employees found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
