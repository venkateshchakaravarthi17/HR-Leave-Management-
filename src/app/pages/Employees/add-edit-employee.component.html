<div class="card shadow-sm"> 
  <div class="card-header">
    
    <h3 class="mb-0">{{ isEdit ? 'Edit Employee' : 'Add Employee' }} </h3>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card-body">

    <!-- Basic Info -->
    <h5>Basic Info</h5>
    <div class="row">
      <div class="col-md-4">
        <label>User Name</label>
        <input formControlName="UserName" class="form-control" placeholder="Enter Username" />
        <div *ngIf="form.get('UserName')?.invalid && form.get('UserName')?.touched" class="text-danger">
          User Name is required
        </div>
      </div>

      <div class="col-md-4">
        <label>Employee Name</label>
        <input formControlName="EmployeeName" class="form-control" placeholder="Enter Employee Name" />
        <div *ngIf="form.get('EmployeeName')?.invalid && form.get('EmployeeName')?.touched" class="text-danger">
          Employee Name is required
        </div>
      </div>

      <div class="col-md-4" *ngIf="!isEdit">
        <label>Password</label>
        <input type="password" formControlName="Password" class="form-control" placeholder="Enter Password" />
        <div *ngIf="form.get('Password')?.invalid && form.get('Password')?.touched" class="text-danger">
          Password is required
        </div>
      </div>
    </div>

    <div class="row mt-2" *ngIf="!isEdit">
      <div class="col-md-4">
        <label>Confirm Password</label>
        <input type="password" formControlName="ConfirmPassword" class="form-control" placeholder="Re-enter Password" />
        <div *ngIf="form.errors?.['mismatch'] && form.get('ConfirmPassword')?.touched" class="text-danger">
          Passwords do not match
        </div>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Role</label>
        <select formControlName="EmployeeRole" class="form-control" [disabled]="!isAdmin">
          <option value="">Select Role</option>
          <option value="Employee">Employee</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="col-md-4">
        <label>Status</label>
        <select formControlName="Status" class="form-control">
          <option value="">Select Status</option>
          <option value="Active">Active</option>
          <option value="InActive">InActive</option>
        </select>
      </div>

      <div class="col-md-4">
        <label>Employment Type</label>
        <select formControlName="EmploymentType" class="form-control">
          <option value="">Select Type</option>
          <option value="FTE">FTE</option>
          <option value="Contract">Contract</option>
        </select>
      </div>
    </div>

    <!-- Work Info -->
    <h5 class="mt-3">Work Info</h5>
    <div class="row">
      <div class="col-md-4">
        <label>Job Title</label>
        <input formControlName="JobTitle" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Department</label>
        <input formControlName="Department" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Manager Name</label>
        <input formControlName="ManagerName" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Date of Joining</label>
        <input type="date" formControlName="DateOfJoining" class="form-control" />
      </div>
    </div>

    <!-- Contract Details -->
    <h5 class="mt-3">Contract Details</h5>
    <div class="row">
      <div class="col-md-4">
        <label>Contract By</label>
        <input formControlName="ContractBy" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Contract End Date</label>
        <input type="date" formControlName="ContractEndDate" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Work Location</label>
        <input formControlName="WorkLocation" class="form-control" />
      </div>
    </div>

    <!-- Personal Details -->
    <h5 class="mt-3">Personal Details</h5>
    <div class="row">
      <div class="col-md-4">
        <label>Gender</label>
        <input formControlName="Gender" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Nationality</label>
        <input formControlName="Nationality" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Date of Birth</label>
        <input type="date" formControlName="DateOfBirth" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Marital Status</label>
        <input formControlName="MaritalStatus" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Emirates ID Number</label>
        <input formControlName="EmiratesIdNumber" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Passport Number</label>
        <input formControlName="PassportNumber" class="form-control" />
      </div>
    </div>

    <!-- Contact Info -->
    <h5 class="mt-3">Contact Info</h5>
    <div class="row">
      <div class="col-md-4">
        <label>Personal Email</label>
        <input formControlName="PersonalEmail" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Work Email</label>
        <input formControlName="WorkEmail" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Work Phone</label>
        <input formControlName="WorkPhone" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Personal Phone</label>
        <input formControlName="PersonalPhone" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Emergency Contact Name</label>
        <input formControlName="EmergencyContactName" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Emergency Contact Relationship</label>
        <input formControlName="EmergencyContactRelationship" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Emergency Contact Number</label>
        <input formControlName="EmergencyContactNumber" class="form-control" />
      </div>
    </div>

    <!-- Address -->
    <h5 class="mt-3">Address</h5>
    <div class="row">
      <div class="col-md-6">
        <label>Current Address</label>
        <input formControlName="CurrentAddress" class="form-control" />
      </div>
      <div class="col-md-6">
        <label>Permanent Address</label>
        <input formControlName="PermanentAddress" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Country</label>
        <input formControlName="CountryOfResidence" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>PO Box</label>
        <input formControlName="PoBox" class="form-control" />
      </div>
    </div>

    <!-- Documents -->
    <h5 class="mt-3">Documents</h5>
    <div class="row">
      <div class="col-md-4">
        <label>Passport Expiry</label>
        <input type="date" formControlName="PassportExpiryDate" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Visa Expiry</label>
        <input type="date" formControlName="VisaExpiryDate" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Emirates ID Expiry</label>
        <input type="date" formControlName="EmiratesIdExpiryDate" class="form-control" />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-md-4">
        <label>Labour Card Expiry</label>
        <input type="date" formControlName="LabourCardExpiryDate" class="form-control" />
      </div>
      <div class="col-md-4">
        <label>Insurance Expiry</label>
        <input type="date" formControlName="InsuranceExpiryDate" class="form-control" />
      </div>
    </div>

    <!-- Submit -->
    <div class="mt-4">
      <button type="submit" style="margin-left: 20px;" class="btn btn-primary">{{ isEdit ? 'Update' : 'Submit' }}</button>
      <button type="button" style="margin-left: 20px;" class="btn btn-secondary ms-2" (click)="cancel()">Cancel</button>
      <button type="button" style="margin-left: 20px;" class="btn btn-info ms-2" (click)="saveDraft()">Save Draft</button>
      <button type="button" style="margin-left: 20px;" class="btn btn-warning ms-2" (click)="clearForm()">Clear</button>
    </div>

  </form>
</div>
